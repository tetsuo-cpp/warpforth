name: GPU

on:
  push:
    branches: [canon]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  LLVM_VERSION: "20"

jobs:
  gpu-test:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'gpu-test' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: gpu-ci
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install LLVM ${{ env.LLVM_VERSION }} and MLIR
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main"
          sudo apt-get update
          sudo apt-get install -y \
            clang-${LLVM_VERSION} \
            llvm-${LLVM_VERSION}-dev \
            libmlir-${LLVM_VERSION}-dev \
            mlir-${LLVM_VERSION}-tools

      - uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-${LLVM_VERSION} \
            -DCMAKE_CXX_COMPILER=clang++-${LLVM_VERSION} \
            -DMLIR_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/mlir \
            -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm

      - name: Build
        run: cmake --build build

      - name: Run GPU tests on Vast.ai
        env:
          VASTAI_API_KEY: ${{ secrets.VASTAI_API_KEY }}
        run: |
          if [ -z "$VASTAI_API_KEY" ]; then
            echo "VASTAI_API_KEY repository secret is not configured" >&2
            exit 1
          fi
          uv run pytest -v -m gpu

      - name: Compare against the base branch on Vast.ai
        if: success() && github.event_name == 'pull_request'
        timeout-minutes: 25
        env:
          VASTAI_API_KEY: ${{ secrets.VASTAI_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
          COMMENT_PATH: ${{ runner.temp }}/bench-comment.md
        run: |
          set -euo pipefail
          # HEAD is GitHub's merge of this pull request. HEAD^1 is the base commit
          # that merge used, which fetch-depth 2 makes available. A depth-1 checkout
          # records the parent SHAs and still cannot resolve them.
          git branch --force "$BASE_REF" HEAD^1
          uv run python -m bench compare "$BASE_REF" HEAD --comment "$COMMENT_PATH"

      - name: Post the bench comparison
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_PATH: ${{ runner.temp }}/bench-comment.md
        run: |
          set -euo pipefail
          if [ ! -s "$COMMENT_PATH" ]; then
            echo "no bench comment to post"
            exit 0
          fi
          export MARKER
          MARKER="$(head -n 1 "$COMMENT_PATH")"
          id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' \
            | tail -n 1)"
          # -F reads the file. -f posts the path string as the comment body.
          if [ -n "$id" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \
              -F body=@"$COMMENT_PATH"
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@"$COMMENT_PATH"
          fi

      - name: Remove GPU test trigger label
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/gpu-test"
