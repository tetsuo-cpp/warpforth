name: CI

on:
  push:
    branches: [canon]
  pull_request:
    branches: [canon]
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "20"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }} and MLIR
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main"
          sudo apt-get update
          sudo apt-get install -y \
            clang-${LLVM_VERSION} \
            clang-format-${LLVM_VERSION} \
            clang-tidy-${LLVM_VERSION} \
            doxygen \
            llvm-${LLVM_VERSION}-dev \
            libmlir-${LLVM_VERSION}-dev \
            mlir-${LLVM_VERSION}-tools

      - uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync --group docs

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-${LLVM_VERSION} \
            -DCMAKE_CXX_COMPILER=clang++-${LLVM_VERSION} \
            -DMLIR_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/mlir \
            -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm \
            -DWARPFORTH_ENABLE_DOCS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cmake --build build --target check-warpforth

      - name: Build documentation
        run: cmake --build build --target docs-warpforth

      - name: Check C++ with clang-tidy
        run: cmake --build build --target check-clang-tidy

      - name: Check C++ formatting
        run: cmake --build build --target check-format

      - name: Ruff check
        run: uv run ruff check gpu_test/ && uv run ruff format --check gpu_test/

      - name: Test GPU infrastructure
        run: uv run pytest -q -m "not gpu"

  gpu-test:
    if: github.event_name == 'push'
    needs: build-and-test
    concurrency:
      group: gpu-ci
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }} and MLIR
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main"
          sudo apt-get update
          sudo apt-get install -y \
            clang-${LLVM_VERSION} \
            llvm-${LLVM_VERSION}-dev \
            libmlir-${LLVM_VERSION}-dev \
            mlir-${LLVM_VERSION}-tools

      - uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-${LLVM_VERSION} \
            -DCMAKE_CXX_COMPILER=clang++-${LLVM_VERSION} \
            -DMLIR_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/mlir \
            -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm

      - name: Build
        run: cmake --build build

      - name: Run GPU tests on Vast.ai
        env:
          VASTAI_API_KEY: ${{ secrets.VASTAI_API_KEY }}
        run: |
          if [ -z "$VASTAI_API_KEY" ]; then
            echo "VASTAI_API_KEY repository secret is not configured" >&2
            exit 1
          fi
          uv run pytest -v -m gpu
